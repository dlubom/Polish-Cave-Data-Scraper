[project]
name = "polish-cave-data-scraper"
version = "0.1.0"
description = "A Python tool to scrape and collect comprehensive data on Polish caves from the Central Geological Database of Polish Caves."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
    "affine>=2.4.0,<3.0.0",
    "beautifulsoup4>=4.11.1,<5.0.0",
    "click>=8.1.0,<9.0.0",
    "flask>=3.0.0,<4.0.0",
    "geopandas>=0.14.0,<1.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pillow>=10.0.0,<11.0.0",
    "pyproj>=3.6.0,<4.0.0",
    "pyspark==3.5.3",
    "rasterio>=1.3.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "simplekml>=1.3.6,<2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "pre-commit-hooks>=5.0.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.15.0,<0.16.0",
    "ty>=0.0.33,<0.0.34",
    "types-requests>=2.32.4.20250913",
]

[tool.uv]
package = false

# ===== Code Quality Tools Configuration =====

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "caves",
    "caves_mono",
    "caves_upscaled",
    "logs",
    "waifu2x-ncnn-vulkan-*",
    "*.ipynb",
]

[tool.ruff.lint]
# Enable rules:
# E/W = pycodestyle errors/warnings
# F = Pyflakes
# I = isort (import sorting)
# N = pep8-naming
# UP = pyupgrade (modern Python syntax)
# B = flake8-bugbear (common bugs)
# C4 = flake8-comprehensions
# SIM = flake8-simplify
# RUF = Ruff-specific rules
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

# Ignore specific rules that are too strict for data-processing scripts.
ignore = [
    "E501",   # Line too long (kept relaxed for scraped field names and prose strings)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Use raise from within except
    "SIM105", # Use contextlib.suppress (sometimes try/except is clearer)
    "UP007",  # Use | for Union (for Python 3.9 compatibility)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["polish-cave-data-scraper"]
force-sort-within-sections = true

[tool.ruff.format]
line-ending = "lf"

[tool.ty.environment]
python-version = "3.9"
root = ["."]

[tool.ty.src]
include = [
    "*.py",
    "locations/*.py",
    "tests",
]
exclude = [
    "caves",
    "caves_mono",
    "caves_upscaled",
    "logs",
    "waifu2x-ncnn-vulkan-*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
