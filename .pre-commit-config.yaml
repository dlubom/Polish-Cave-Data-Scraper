# Pre-commit hooks for code quality.
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

exclude: |
  (?x)^(
    caves/|
    caves_mono/|
    caves_upscaled/|
    logs/|
    waifu2x-ncnn-vulkan-[^/]+/|
    .*\.jsonl$|
    .*\.parquet/|
    .*\.jpg$|
    .*\.tif$|
    .*\.zip$
  )

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]

      - id: check-json
        name: check json
        entry: uv run check-json
        language: system
        types: [json]

      - id: check-toml
        name: check toml
        entry: uv run check-toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: check merge conflict markers
        entry: uv run check-merge-conflict
        language: system
        types: [text]

      - id: debug-statements
        name: check debug statements
        entry: uv run debug-statement-hook
        language: system
        types: [python]
